<header class="flex flex-wrap items-center gap-x-4 gap-y-3 border-b border-outline-variant bg-surface-container-lowest px-4 py-3 md:px-6">
  <!-- Botón de menú, solo móvil: abre el cajón lateral. -->
  <button
    type="button"
    class="btn-icon md:hidden"
    (click)="layoutService.alternar()"
    aria-label="Abrir menú de navegación"
  >
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>

  <!-- Marca: gimnasio de la sesión. -->
  <span class="truncate font-display text-lg font-bold text-primary">
    {{ authService.nombreGimnasio() ?? '···' }}
  </span>

  <!-- Buscador global de clientes (RF-03). Ocupa toda la fila en móvil. -->
  <form class="relative order-3 w-full md:order-none md:ml-4 md:w-auto md:max-w-md md:flex-1" (ngSubmit)="buscar()">
    <span
      class="material-symbols-outlined pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant"
      aria-hidden="true"
    >search</span>
    <input
      type="search"
      class="field-search"
      placeholder="Buscar clientes…"
      [formControl]="busqueda"
      aria-label="Buscar clientes"
    />
  </form>

  <!-- Chip de usuario. -->
  <div class="relative ml-auto">
    <button
      type="button"
      class="flex min-h-11 items-center gap-2 rounded-lg px-2 py-1 transition-colors hover:bg-surface-container-low"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAbierto()"
      aria-haspopup="true"
    >
      <span
        class="flex size-9 shrink-0 items-center justify-center rounded-full bg-primary font-display text-sm font-semibold text-on-primary"
      >
        {{ iniciales() }}
      </span>
      <span class="hidden text-left sm:block">
        <span class="block truncate text-sm font-semibold leading-tight text-on-surface">
          {{ nombreCompleto() || '···' }}
        </span>
        <span class="block truncate font-mono text-[10px] uppercase leading-tight tracking-wide text-on-surface-variant">
          {{ authService.nombreRol() ?? '···' }}
        </span>
      </span>
    </button>

    @if (menuAbierto()) {
      <div class="card-base absolute right-0 z-50 mt-2 w-48 overflow-hidden py-1">
        <button
          type="button"
          class="flex min-h-11 w-full items-center gap-2 px-4 py-2 text-left text-sm text-on-surface transition-colors hover:bg-surface-container-low"
          (click)="cerrarSesion()"
        >
          <span class="material-symbols-outlined" aria-hidden="true">logout</span>
          Cerrar sesión
        </button>
      </div>
    }
  </div>
</header>
