<div class="shell">
  <header class="cabecera">
    <button
      type="button"
      class="boton-menu-movil"
      (click)="alternarMenuMovil()"
      [attr.aria-expanded]="menuMovilAbierto()"
      aria-label="Abrir menú"
    >
      ☰
    </button>

    <span class="nombre-gimnasio">{{ nombreGimnasio() ?? 'Gimnasio' }}</span>

    <div class="usuario-actual">
      @if (usuario(); as u) {
        <span class="usuario-nombre">{{ u.nombre }}</span>
        <span class="usuario-rol">{{ nombreRol() ?? ('Rol #' + u.rol) }}</span>
      }
      <button type="button" class="boton-salir" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  </header>

  <div class="cuerpo">
    <nav class="nav-lateral" [class.nav-abierta]="menuMovilAbierto()">
      <a
        routerLink="/pos"
        routerLinkActive="enlace-activo"
        class="enlace-nav"
        (click)="cerrarMenuMovil()"
      >
        Punto de venta
      </a>
    </nav>

    @if (menuMovilAbierto()) {
      <div class="fondo-oscurecido" (click)="cerrarMenuMovil()"></div>
    }

    <main class="contenido">
      <router-outlet />
    </main>
  </div>
</div>
